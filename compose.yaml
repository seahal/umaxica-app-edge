name: umaxica-apps-edge

services:
  core:
    build:
      context: .
      dockerfile: Containerfile
      args:
        CONTAINER_UID: ${UID:-1000}
        CONTAINER_GID: ${GID:-1000}
        CONTAINER_USER: edge
        CONTAINER_GROUP: edge
    working_dir: /home/edge/workspace
    volumes:
      - type: bind
        source: .
        target: /home/edge/workspace
        consistency: cached
      - type: volume
        source: node-volume
        target: /home/edge/workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: home-cache
        target: /home/edge/.cache
      - type: volume
        source: pnpm-store
        target: /home/edge/.local/share/pnpm/store
      - type: volume
        source: workspace-secrets-mask
        target: /home/edge/workspace/.secrets
        read_only: true
        volume:
          nocopy: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/.env
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/core/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/docs/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/help/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/info/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/news/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/core/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/docs/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/help/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/info/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/news/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/core/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/docs/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/help/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/info/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/news/.env.development.local
        read_only: true
    ports:
      - '127.0.0.1:5101:5101' # com/apex
      - '127.0.0.1:5103:5103' # com/info
      - '127.0.0.1:5105:5105' # com/core
      - '127.0.0.1:5106:5106' # com/docs
      - '127.0.0.1:5107:5107' # com/news
      - '127.0.0.1:5108:5108' # com/help
      - '127.0.0.1:5201:5201' # net/apex
      - '127.0.0.1:5301:5301' # org/apex
      - '127.0.0.1:5303:5303' # org/info
      - '127.0.0.1:5305:5305' # org/core
      - '127.0.0.1:5306:5306' # org/docs
      - '127.0.0.1:5307:5307' # org/news
      - '127.0.0.1:5308:5308' # org/help
      - '127.0.0.1:5401:5401' # app/apex
      - '127.0.0.1:5403:5403' # app/info
      - '127.0.0.1:5405:5405' # app/core
      - '127.0.0.1:5406:5406' # app/docs
      - '127.0.0.1:5407:5407' # app/news
      - '127.0.0.1:5408:5408' # app/help
      - '127.0.0.1:5501:5501' # dev/apex
      # Browser OAuth callback for `wrangler login`. Cloudflare credentials are
      # now obtained interactively inside the container instead of being
      # injected as a long-lived API token, so this port is part of the base
      # environment rather than an opt-in credential overlay.
      - '127.0.0.1:8976:8976' # wrangler login callback
    command: sleep infinity
    tty: true
    stdin_open: true
    init: true
    userns_mode: keep-id
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CLOUDFLARE_ENV: development
    restart: unless-stopped

volumes:
  node-volume:
    driver: local
  home-cache:
    driver: local
  pnpm-store:
    driver: local
  workspace-secrets-mask:
    driver: local
