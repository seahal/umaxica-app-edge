# The one compose project for this repository. `.devcontainer/devcontainer.json`,
# `scripts/dev-start` and a bare `podman compose` all resolve to this same name, so
# they share one set of containers and volumes. Developer-local additions go in
# `compose.custom.yaml`, which is the only other compose file in the repository.
name: umaxica-apps-edge

services:
  core:
    build:
      context: .
      dockerfile: Containerfile
      args:
        CONTAINER_UID: ${UID:-1000}
        CONTAINER_GID: ${GID:-1000}
        CONTAINER_USER: edge
        CONTAINER_GROUP: edge
    working_dir: /home/edge/workspace
    volumes:
      - type: bind
        source: .
        target: /home/edge/workspace
        consistency: cached
      - type: volume
        source: node-volume
        target: /home/edge/workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: home-cache
        target: /home/edge/.cache
      - type: volume
        source: pnpm-store
        target: /home/edge/.local/share/pnpm/store
      - type: volume
        source: workspace-secrets-mask
        target: /home/edge/workspace/.secrets
        read_only: true
        volume:
          nocopy: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/.env
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/core/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/docs/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/help/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/info/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/app/news/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/core/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/docs/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/help/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/info/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/com/news/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/core/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/docs/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/help/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/info/.env.development.local
        read_only: true
      - type: bind
        source: ./.devcontainer/empty.env
        target: /home/edge/workspace/org/news/.env.development.local
        read_only: true
    ports:
      - '127.0.0.1:5101:5101' # com/apex
      - '127.0.0.1:5103:5103' # com/info
      - '127.0.0.1:5105:5105' # com/core
      - '127.0.0.1:5106:5106' # com/docs
      - '127.0.0.1:5107:5107' # com/news
      - '127.0.0.1:5108:5108' # com/help
      - '127.0.0.1:5201:5201' # net/apex
      - '127.0.0.1:5301:5301' # org/apex
      - '127.0.0.1:5303:5303' # org/info
      - '127.0.0.1:5305:5305' # org/core
      - '127.0.0.1:5306:5306' # org/docs
      - '127.0.0.1:5307:5307' # org/news
      - '127.0.0.1:5308:5308' # org/help
      - '127.0.0.1:5401:5401' # app/apex
      - '127.0.0.1:5403:5403' # app/info
      - '127.0.0.1:5405:5405' # app/core
      - '127.0.0.1:5406:5406' # app/docs
      - '127.0.0.1:5407:5407' # app/news
      - '127.0.0.1:5408:5408' # app/help
      - '127.0.0.1:5501:5501' # dev/apex
      # Browser OAuth callback for `wrangler login`. Cloudflare credentials are
      # now obtained interactively inside the container instead of being
      # injected as a long-lived API token, so this port is part of the base
      # environment rather than an opt-in credential overlay.
      - '127.0.0.1:8976:8976' # wrangler login callback
    command: sleep infinity
    tty: true
    stdin_open: true
    init: true
    userns_mode: keep-id
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CLOUDFLARE_ENV: development
      # Read only by `tools/verify-edge-connectivity.mjs` as an "am I inside the
      # container" hint, alongside its `/.dockerenv` fallback. It is a property of
      # this service rather than of the editor attached to it, so it belongs here
      # rather than in an overlay only VS Code loads.
      DEVCONTAINER: '1'
    restart: unless-stopped

  # Edge owns this connector and its tunnel. It is intentionally independent from the
  # Global/Rails connector: the two share neither a Podman network nor a tunnel token.
  # Public hostnames on this tunnel must be protected by Cloudflare Access.
  #
  # It lives here rather than in `compose.custom.yaml` because the connector, its
  # pinned release and its hardening are project-wide facts; only the token is
  # per-developer, and that arrives from the gitignored `.env`. Starting it is still
  # opt-in — `scripts/dev-start` names `core` alone unless `--tunnel` is passed.
  cloudflare-tunnel:
    image: docker.io/cloudflare/cloudflared:2026.8.2
    depends_on:
      - core
    command: tunnel --protocol quic --metrics 0.0.0.0:2000 run
    environment:
      # Prefer the Edge-specific token; a single-tunnel local setup may only have the
      # generic CLOUDFLARED_TOKEN in .env.
      #
      # Neither carries a `:?` guard, and that is not an oversight. Compose
      # interpolates the whole file whichever services you name, so a required
      # variable here would stop `podman compose -f compose.yaml up core` on every
      # machine that never intends to run a tunnel — which, now that the connector
      # is shared rather than an opt-in overlay, is most of them. The requirement is
      # enforced where it is actually a requirement: `scripts/dev-start --tunnel`
      # refuses to start without a token, and cloudflared itself exits non-zero on
      # an empty one, bounded by `restart: on-failure:3`.
      TUNNEL_TOKEN: '${EDGE_CLOUDFLARED_TOKEN:-${CLOUDFLARED_TOKEN:-}}'
    restart: on-failure:3
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  node-volume:
    driver: local
  home-cache:
    driver: local
  pnpm-store:
    driver: local
  workspace-secrets-mask:
    driver: local
