name: umaxica-apps-edge-dc

# Edge owns this connector and its tunnel. It is intentionally independent from the
# Global/Rails connector: the two compose projects share neither a Podman network nor a
# tunnel token. Public hostnames on this tunnel must be protected by Cloudflare Access.
services:
  cloudflare-tunnel:
    image: docker.io/cloudflare/cloudflared:2026.8.2
    depends_on:
      - core
    command: tunnel --protocol quic --metrics 0.0.0.0:2000 run
    environment:
      # Prefer the Edge-specific token. A single-tunnel local setup may only have the
      # generic CLOUDFLARED_TOKEN in .env, so fall back to it rather than refusing to
      # render the compose file at all; one of the two must be set.
      TUNNEL_TOKEN: '${EDGE_CLOUDFLARED_TOKEN:-${CLOUDFLARED_TOKEN:?EDGE_CLOUDFLARED_TOKEN or CLOUDFLARED_TOKEN must be set in .env}}'
    restart: on-failure:3
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
