# The developer-local overlay. This is the only compose file in the repository you
# are expected to edit for your own machine; `compose.yaml` holds what everyone
# shares. It is tracked so that the Rails wiring below has one known-good form, but
# a local edit here is not a defect — do not treat a diff in this file as one.
#
# Nothing loads it implicitly. `.devcontainer/devcontainer.json` names `compose.yaml`
# alone, so a devcontainer never picks this up; `scripts/dev-start --rails` adds it,
# and so does a manual `podman compose -f compose.yaml -f compose.custom.yaml`.
#
# It deliberately declares no `name:`. The last `-f` wins, so setting one here would
# silently fork the compose project and strand the volumes created without it.
services:
  core:
    # Outbound connectivity to a Rails stack running in its own rootless Podman
    # project on this machine. The network is external and named by you, because
    # nothing in this repository creates or owns it.
    environment:
      EDGE_LOCAL_RAILS_ENABLED: '1'
    networks:
      - default
      - rails

networks:
  rails:
    external: true
    name: ${EDGE_RAILS_NETWORK:?EDGE_RAILS_NETWORK must name an existing rootless Podman network}
