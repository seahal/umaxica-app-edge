<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="UMAXICA のウェブサイトは現在メンテナンス中です。" />
    <meta name="color-scheme" content="light dark" />
    <title>UMAXICA — Maintenance</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        font-family:
          Inter,
          'Noto Sans JP',
          'Hiragino Sans',
          'Yu Gothic UI',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #171717;
        background: #fafafa;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #f5f5f5;
          background: #171717;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 42rem);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.5rem 0;
        line-height: 1.7;
      }

      .en {
        opacity: 0.7;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UMAXICA</h1>
      <p>このウェブサイトは現在メンテナンス中です。</p>
      <p class="en" lang="en">This website is currently undergoing maintenance.</p>
    </main>
  </body>
</html>
