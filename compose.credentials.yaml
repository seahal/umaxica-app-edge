services:
  core:
    ports:
      - '127.0.0.1:8976:8976'
    volumes:
      - type: volume
        source: wrangler-config
        target: /home/edge/.config/.wrangler
      - type: volume
        source: opencode-state
        target: /home/edge/.local/share/opencode
    secrets:
      - source: dev_github_token
        mode: 0400
      - source: dev_cloudflare_access_client_id
        mode: 0400
      - source: dev_cloudflare_access_client_secret
        mode: 0400
      - source: dev_claude_api_key
        mode: 0400
      - source: dev_codex_api_key
        mode: 0400

volumes:
  wrangler-config:
    driver: local
  opencode-state:
    driver: local

secrets:
  dev_github_token:
    external: true
  dev_cloudflare_access_client_id:
    external: true
  dev_cloudflare_access_client_secret:
    external: true
  dev_claude_api_key:
    external: true
  dev_codex_api_key:
    external: true
