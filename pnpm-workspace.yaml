  - app/core
  - app/docs
  - app/help
  - app/info
  - app/news
  - com/apex
  - com/core
  - com/docs
  - com/help
  - com/info
  - com/news
  - dev/acme
  - dev/apex
  - net/apex
  - org/apex
  - org/core
  - org/docs
  - org/help
  - org/info
  - org/news

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

catalog:
  '@cloudflare/workers-types': ^5.20260820.1
  '@opennextjs/cloudflare': ^1.20.2
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  hono: ^4.13.3
  next: ^16.3.1
  nuqs: ^2.10.0
  react: ^19.2.8
  react-dom: ^19.2.8
  vitest: ^4.1.11
  wrangler: ^4.125.0

ignoredBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - sharp
  - workerd

# Hold newly published versions back so a compromised release has time to be
# pulled from the registry before it can be installed here.
#
# 1440 is also pnpm 11's default, so this line changes no version by itself.
# It is spelled out because leaving it implicit costs the two settings below:
# `minimumReleaseAgeStrict` only defaults to true when `minimumReleaseAge` is
# set EXPLICITLY. Implicit meant strict=false, and strict=false makes pnpm fall
# back to a version that violates the delay whenever no aged version satisfies
# the range — the delay reads as enforced while quietly not being. Explicit also
# survives a pnpm major that changes its own default.
minimumReleaseAge: 1440

# Fail resolution instead of silently installing a too-young version. If this
# ever blocks an update, the fix is to wait out the window or add a justified
# entry to minimumReleaseAgeExclude below — not to turn this off.
minimumReleaseAgeStrict: true

# Refuse to install rather than skip the age check when registry metadata has no
# `time` field. The default (true) is a silent bypass for the WHOLE policy, and
# this repository installs from a private registry (registry=https://npm.flatt.tech/
# in .npmrc) rather than registry.npmjs.org — exactly the mirror case pnpm warns
# omits `time`. That registry does serve `time` today (verified against its
# wrangler metadata), so this costs nothing now and turns a future mirror change
# from a silent loss of protection into a loud failure.
minimumReleaseAgeIgnoreMissingTime: false

# Live exceptions, not dead config: entries here are pins that were bumped
# inside their own release window, so re-check them on every bump — an entry
# kept past its bump is a standing hole. Empty today: the previous exceptions
# (miniflare@5.20260804.0-alpha, wrangler@4.120.1) have both been superseded by
# versions that clear the delay on their own.
minimumReleaseAgeExclude: []

overrides:
  nanoid: ^3.3.17
  vitest: 'catalog:'
  # @opentelemetry/sdk-logs@0.214.0 (reached through @vercel/otel in dev/acme)
  # pulls @opentelemetry/core@2.6.1, which is vulnerable to GHSA-8988-4f7v-96qf:
  # unbounded memory allocation in W3C Baggage propagation, fixed in 2.8.0.
  # Bumping sdk-logs alone does not clear it — @vercel/otel's peer constraint
  # holds the old core in place. 2.10.0 is already resolved elsewhere in this
  # tree via @sentry/nextjs, so this override dedupes onto a version that is
  # already installed rather than introducing a new one.
  '@opentelemetry/core': '>=2.8.0'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
